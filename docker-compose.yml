services:
  postgres:
    image: postgres:17
    container_name: bookhub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: bookhubdb
      POSTGRES_USER: bookhub
      POSTGRES_PASSWORD: bookhubpwd
    ports:
      - "5432:5432"
    volumes:
      - bookhub-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookhub -d bookhubdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: BookHub.API/Dockerfile
    container_name: bookhub-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Development: applies migrations, seeds sample data and exposes Swagger (demo shortcut)
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=bookhubdb;Username=bookhub;Password=bookhubpwd
      Logging__UseJson: "true"
    ports:
      - "5254:8080"

volumes:
  bookhub-pgdata:
