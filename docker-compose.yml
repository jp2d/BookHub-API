services:
  postgres:
    image: postgres:17
    container_name: bookhub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: bookhubdb
      POSTGRES_USER: bookhub
      POSTGRES_PASSWORD: bookhubpwd
    ports:
      - "5432:5432"
    volumes:
      - bookhub-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookhub -d bookhubdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: BookHub.API/Dockerfile
    container_name: bookhub-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Development: applies migrations, seeds sample data and exposes Swagger (demo shortcut)
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=bookhubdb;Username=bookhub;Password=bookhubpwd
      Logging__UseJson: "true"
    ports:
      - "5254:8080"
    healthcheck:
      # The runtime image has no curl/wget, so the probe talks to /health through bash's /dev/tcp.
      test:
        - CMD
        - bash
        - -c
        - exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health HTTP/1.0\r\n\r\n' >&3 && head -1 <&3 | grep -q ' 200 '
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

volumes:
  bookhub-pgdata:
